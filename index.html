<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pion AI</title>
<style>
  :root {
    --paper: #eee9dd;
    --ink: #1c1815;
    --ink-soft: #4a443c;
    --rule: #cfc6b4;
    --accent: #8a6a2e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17140f;
      --ink: #f0ead9;
      --ink-soft: #b7ac96;
      --rule: #3a3427;
      --accent: #c9a968;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  main {
    text-align: center;
    max-width: 34rem;
  }

  .mark {
    font-family: "Avenir Next", "Century Gothic", "Futura", sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 9vw, 4.2rem);
    letter-spacing: -0.01em;
    margin: 0;
  }

  .mark .ai {
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .rule {
    width: 3rem;
    height: 1px;
    background: var(--rule);
    margin: 1.6rem auto;
  }

  .tagline {
    font-style: italic;
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    color: var(--ink-soft);
    margin: 0 0 2.2rem;
  }

  .status {
    font-family: "Avenir Next", "Century Gothic", "Futura", sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }
</style>
</head>
<body>
  <main>
    <p class="mark">PION <span class="ai">AI</span></p>
    <div class="rule"></div>
    <p class="tagline">Elke pion kan koningin worden.</p>
    <p class="status">Binnenkort</p>
  </main>
</body>
</html>
